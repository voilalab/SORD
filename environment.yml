# SORD, image benchmarks + SGM baseline (TensorFlow CelebA score model, PyTorch EDM2 / ADM priors).
# Versions are those of the environment the paper's runs and the verification runs used (Linux, CUDA 11.x GPU).
#   conda env create -f environment.yml && conda activate sord
#   export LD_LIBRARY_PATH=$CONDA_PREFIX/lib:$LD_LIBRARY_PATH   # TensorFlow finds the conda CUDA libraries
name: sord
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - cudatoolkit=11.2
  - cudnn=8.1
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu113
      - torch==1.12.1+cu113
      - torchvision==0.13.1+cu113
      - tensorflow==2.9.3
      - keras==2.9.0
      - tensorflow-addons==0.21.0
      - protobuf==3.19.6
      - numpy==1.23.5
      - scipy==1.10.1
      - PyYAML==6.0.3
      - pillow==10.4.0
      - matplotlib==3.7.5
      - scikit-image==0.21.0
      - opencv-python==4.13.0.92
      - h5py==3.11.0
      - cvxopt==1.3.3
      - pandas==2.0.3
      - scikit-learn==1.3.2
      - bm3d==4.0.1          # utils/inverse.py (SGM baseline)
      - lpips==0.1.4         # utils/metrics.py
      - imageio==2.35.1
      - SciencePlots==2.2.1
      - easydict==1.13
      - huggingface_hub==0.36.2
      - gdown==5.2.2
      - requests==2.32.4
      - tqdm==4.68.2
      - wandb==0.24.2        # imported by the model-loading utilities; no account needed
