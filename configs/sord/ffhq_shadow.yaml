# SORD on FFHQ faces + ISTD shadow fields (256^2), ADM ffhq_10m.
#   python -m sord.run configs/sord/ffhq_shadow.yaml --out runs/ffhq_shadow
bench: experiments/extbench/results/ffhqsh0_native/bench_ffhqsh0_native.npz          # relative to DATA_ROOT (replay release: reproduction/fetch_assets.py)
prior: {kind: adm_ffhq256, checkpoint: adm_ffhq256}          # checkpoint_manifest.json
seed: 12345
sord:
  K: 32                 # diffusion samples
  M: 3                  # maximum refinement iterations (as in the reported run)
  sigma_start: 0.4      # re-noising schedule sigma_m, linear in m ...
  sigma_end: 0.1        # ... from 0.4 to 0.1
  tau_stop: 0.2        # relative-decrease stopping threshold (configs/sord/tau_stop.yaml)
  model: multiplicative # y = x + n (additive) or y = x * h (multiplicative, shadows)
  corruption: free      # additive class: pos (n >= 0) or free (signed)
  zero_anchor: false    # residual normalization for a non-negative contaminant on black
