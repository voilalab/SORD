# SORD on Imagenette + CLWD logos (256^2), ADM ImageNet-256.
#   python -m sord.run configs/sord/imagenette_watermark.yaml --out runs/imagenette_watermark
bench: experiments/extbench/results/imagenetwm_native/bench_imagenetwm_native.npz          # relative to DATA_ROOT (replay release: reproduction/fetch_assets.py)
prior: {kind: adm_imagenet256, checkpoint: adm_imagenet256}          # checkpoint_manifest.json
seed: 12345
sord:
  K: 32                 # diffusion samples
  M: 3                  # maximum refinement iterations (as in the reported run)
  sigma_start: 0.4      # re-noising schedule sigma_m, linear in m ...
  sigma_end: 0.1        # ... from 0.4 to 0.1
  tau_stop: 0.2        # relative-decrease stopping threshold (configs/sord/tau_stop.yaml)
  model: additive       # y = x + n (additive) or y = x * h (multiplicative, shadows)
  corruption: free      # additive class: pos (n >= 0) or free (signed)
  zero_anchor: false    # residual normalization for a non-negative contaminant on black
